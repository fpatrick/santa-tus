# Runs the tests on every push, then publishes the staff test link on GitHub Pages (P1-P4).
name: Test and publish the test link

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule tests (T1-T26)
        run: npm test
      - name: Server tests (T14, T29, D2, D5)
        run: python -m unittest discover -s tests -p "test_*.py"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the game files (no server, P1)
        run: |
          mkdir _site
          cp -r index.html style.css src assets print _site/
          touch _site/.nojekyll
      - name: Cache-busting (browsers load the new version, not old saved files)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[a-z0-9]+\.js)'#\1?v=$V'#g" _site/src/*.js
          sed -i -E "s#(from '\.\./src/[a-z0-9]+\.js)'#\1?v=$V'#g" _site/print/odds.html
          sed -i -E "s#(src/main\.js|style\.css)\"#\1?v=$V\"#g" _site/index.html
          grep -c "?v=$V" _site/index.html _site/src/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
